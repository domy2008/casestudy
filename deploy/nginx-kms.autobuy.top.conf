server {
    server_name kms.autobuy.top;

    # Bot webhooks + liveness probe -> FastAPI backend (:8000).
    # Regex location wins over the prefix "location /" below, so the
    # Teams/WhatsApp webhook URLs registered at Azure/Meta keep working.
    location ~ ^/(webhooks/(teams|whatsapp)|health)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Old /admin/ URL -> root (UI now served at /).
    location /admin/ {
        return 301 /;
    }
    location = /admin {
        return 301 /;
    }

    # Logout -> the in-app login gate clears the session on ?logout=1 and
    # shows the branded AIA login page again. (Auth is handled inside the
    # Streamlit app now, not by nginx basic-auth.)
    location = /logout {
        return 302 /?logout=1;
    }

    # Admin UI (Streamlit) at the root. WebSocket upgrade headers are
    # required: all Streamlit app traffic runs over /_stcore/stream.
    # No auth_basic here: the app renders its own branded login screen.
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 60m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kms.autobuy.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kms.autobuy.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = kms.autobuy.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kms.autobuy.top;
    return 404; # managed by Certbot
}
